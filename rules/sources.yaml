# Regulatory and internal sources cited by the SMCyber rules and by every proposal clause.
# kind: REGULATION / REGULATOR_GUIDANCE = verbatim text of an official Indian document (url = where it is published).
#       Whitespace from the PDF layout is joined into single spaces and running page headers are dropped; nothing else is changed.
#       UNDERWRITING_GUIDELINE / TECHNICAL_SPEC / GOVERNANCE = our own documents, labelled as such (not regulation).
# CYB-SRC-002 requires every citation snippet to be a byte-exact substring of full_text.
sources:
  - source_code: IRDAI-CYBER-2021-5.5.1a
    title: "Business interruption cover and its waiting period"
    section: "5.5.1(a)"
    kind: REGULATOR_GUIDANCE
    issuer: "Insurance Regulatory and Development Authority of India (IRDAI)"
    document: "Guidance Document on Product Structure for Cyber Insurance (8 Sep 2021)"
    url: "https://irdai.gov.in/document-detail?documentId=976463"
    full_text: "a) Business interruption: Coverage is offered for business interruption loss (loss of net profits) as a result of a Cyber-attack that causes total or partial unavailability of the company’s computer system which are in direct control of the insured. Coverage for such loss of profit is subject to waiting periods (in hours or days) as agreed in the policy. Further, costs incurred to restore the Company’s Computer System to the same level of functionality which existed immediately prior to such event and the costs to retrieve or reinstall Data or Computer Programmes are also offered."
    effective_date: "2021-09-08"
    expiry_date: null
    jurisdiction: IN

  - source_code: IRDAI-CYBER-2021-5.5.1b
    title: "Cyber extortion cover"
    section: "5.5.1(b)"
    kind: REGULATOR_GUIDANCE
    issuer: "Insurance Regulatory and Development Authority of India (IRDAI)"
    document: "Guidance Document on Product Structure for Cyber Insurance (8 Sep 2021)"
    url: "https://irdai.gov.in/document-detail?documentId=976463"
    full_text: "b) Cyber Extortion: Coverage is offered for Cyber Extortion Loss that the Insured incurs solely and directly as a result of a Cyber Extortion Threat. Such loss is triggered when a hacker breaks into computer system and threatens to commit a wicked act like damaging the data, introducing a virus, initiating a denial of service attack, or releasing confidential data unless the insured pays a specified sum. Coverage typically extends to any extortion payment that the company has to make and expenses incurred while responding to the demand."
    effective_date: "2021-09-08"
    expiry_date: null
    jurisdiction: IN

  - source_code: IRDAI-CYBER-2021-5.5.2a
    title: "Privacy and data breach liability, including response costs"
    section: "5.5.2(a)"
    kind: REGULATOR_GUIDANCE
    issuer: "Insurance Regulatory and Development Authority of India (IRDAI)"
    document: "Guidance Document on Product Structure for Cyber Insurance (8 Sep 2021)"
    url: "https://irdai.gov.in/document-detail?documentId=976463"
    full_text: "a) Privacy and Data Breach Liability including customer notification and credit monitoring costs: Coverage is offered for Damages and Defence Costs for a claim made against the Insured by any affected person or a client resulting from a privacy beach or a data breach for which the Insured is legally liable."
    effective_date: "2021-09-08"
    expiry_date: null
    jurisdiction: IN

  - source_code: IRDAI-CYBER-2021-5.5.2a-R
    title: "Data breach response costs (notification, credit monitoring, data preservation)"
    section: "5.5.2(a)"
    kind: REGULATOR_GUIDANCE
    issuer: "Insurance Regulatory and Development Authority of India (IRDAI)"
    document: "Guidance Document on Product Structure for Cyber Insurance (8 Sep 2021)"
    url: "https://irdai.gov.in/document-detail?documentId=976463"
    full_text: "Insured could also incur substantial Response costs that may include (i) notification expenses towards the affected third parties and regulators in such an event (ii) credit monitoring services for a defined period - these include the monitoring of one's credit history for a specified period for to detect any suspicious activity or unauthorized charges. It also may provide special alerts when there are noticeable changes to one's credit history (iii) cost of identifying and preserving relevant Data on the Company’s Computer System"
    effective_date: "2021-09-08"
    expiry_date: null
    jurisdiction: IN

  - source_code: IRDAI-CYBER-2021-5.5.2d
    title: "Regulatory inquiry and insurable fines and penalties"
    section: "5.5.2(d)"
    kind: REGULATOR_GUIDANCE
    issuer: "Insurance Regulatory and Development Authority of India (IRDAI)"
    document: "Guidance Document on Product Structure for Cyber Insurance (8 Sep 2021)"
    url: "https://irdai.gov.in/document-detail?documentId=976463"
    full_text: "It covers the costs of dealing with privacy regulatory authorities / agencies (which oversee data breach laws and regulations), including • the costs of hiring lawyers to consult with regulators during investigations and • the payment of regulatory fines and penalties (insurable by law) that are levied against the insured (as a result of the breach)."
    effective_date: "2021-09-08"
    expiry_date: null
    jurisdiction: IN

  - source_code: IRDAI-CYBER-2021-5.8
    title: "Major exclusions of cyber policies"
    section: "5.8"
    kind: REGULATOR_GUIDANCE
    issuer: "Insurance Regulatory and Development Authority of India (IRDAI)"
    document: "Guidance Document on Product Structure for Cyber Insurance (8 Sep 2021)"
    url: "https://irdai.gov.in/document-detail?documentId=976463"
    full_text: "5.8 MAJOR EXCLUSIONS: 5.8.1 Dishonest or Deliberate Wilful conduct Any fraudulent, dishonest activity, willful violation, breach of law done by the insured stands excluded from scope of coverage. This exclusion could be amended to include defence cost coverage for innocent insured and could also contain final adjudication clause. 5.8.1 Contingent Business Interruption This clause excludes any business interruption loss resulting from damage to the computer system of a service provider or a supplier on which the insured depends. 5.8.2 External Infrastructure Failure This clause excludes any claims arising due to any electrical or mechanical failure of infrastructure including any electrical power interruption, surge , brown out , black out , failure of telephone lines , data transmission lines , any satellite failure or any other telecom / network infrastructure which are not under the control of the insured / the outsource service provider. 5.8.3 Bodily Injury and Property Damage This clause excludes any actual or alleged bodily injury, sickness, mental anguish or emotional distress or disturbance, disease or death of any person howsoever caused or damage to or destruction of any tangible property, including loss of use thereof. As the control and operation of physical assets becomes increasingly managed by computers that are themselves interconnected, cyber-attack on automation / operational technologies could cause property damage and bodily injury related losses. Such losses are excluded from cyber policy as the Property and casualty policies are expected to address coverage for bodily injury and property damage. Insurers may consider extending the coverage by amending the definition of Bodily Injury to include mental anguish, mental injury, emotional distress resulting from a Privacy Breach or Media Wrongful Act. 5.8.4 War, terrorism, Invasion, riot, or insurrection This clause excludes coverage for loss from acts of war, terrorism, invasion, and/or insurrection. Since the repercussions of state-sponsored, political, and ideological cyber-attacks could be too vast and across industries, coverage for such events is excluded. For ex. NotPetya exposed a serious ambiguity in how insurance policies treat state-sponsored cyber incidents. Some property and casualty insurers declined to pay NotPetya-related claims, invoking their war exclusions. However, recently there is coverage available for “cyberterrorism” or “electronic terrorism”, but Cyber war still stays as a common exclusion. 5.8.5 Monetary and Trading losses The theft of money, trading losses or securities are typically excluded from a cyber-policy. 5.8.6 Prior act Cyber policies typically exclude any cyber incidents which existed prior to the insurance policy commencement."
    effective_date: "2021-09-08"
    expiry_date: null
    jurisdiction: IN

  - source_code: IRDAI-CYBER-2021-MW-EXT
    title: "Model policy wording: conditions of the Cyber Extortion Cover"
    section: "Annexure, Model Policy Wordings, cover iii"
    kind: REGULATOR_GUIDANCE
    issuer: "Insurance Regulatory and Development Authority of India (IRDAI)"
    document: "Guidance Document on Product Structure for Cyber Insurance (8 Sep 2021)"
    url: "https://irdai.gov.in/document-detail?documentId=976463"
    full_text: "As a condition for payment under this cover the Insured shall: i. keep the terms and conditions of this Cyber Extortion Cover confidential, unless disclosure to law enforcement authorities is required; and ii. Take all reasonable steps to notify and cooperate with the appropriate law enforcement authorities; and iii. Take all reasonable steps (including the involvement of a security consultant with the Insurer’s prior written consent), to effectively mitigate the Cyber Extortion Loss."
    effective_date: "2021-09-08"
    expiry_date: null
    jurisdiction: IN

  - source_code: CERT-IN-2022-DIR-ii
    title: "Mandatory reporting of cyber incidents to CERT-In within 6 hours"
    section: "Direction (ii)"
    kind: REGULATION
    issuer: "Indian Computer Emergency Response Team (CERT-In), MeitY"
    document: "Directions under section 70B(6) of the IT Act, 2000, No. 20(3)/2022-CERT-In (28 Apr 2022)"
    url: "https://www.cert-in.org.in/PDF/CERT-In_Directions_70B_28.04.2022.pdf"
    full_text: "(ii) Any service provider, intermediary, data centre, body corporate and Government organisation shall mandatorily report cyber incidents as mentioned in Annexure I to CERT-In within 6 hours of noticing such incidents or being brought to notice about such incidents."
    effective_date: "2022-06-27"
    expiry_date: null
    jurisdiction: IN

  - source_code: DPDP-2023-S8-6
    title: "Intimation of a personal data breach to the Board and each affected Data Principal"
    section: "8(6)"
    kind: REGULATION
    issuer: "Parliament of India"
    document: "Digital Personal Data Protection Act, 2023 (No. 22 of 2023)"
    url: "https://www.meity.gov.in/static/uploads/2024/06/2bf1f0e9f04e6fb4f8fef35e82c42aa5.pdf"
    full_text: "(6) In the event of a personal data breach, the Data Fiduciary shall give the Board and each affected Data Principal, intimation of such breach in such form and manner as may be prescribed."
    effective_date: "2027-05-13"
    expiry_date: null
    jurisdiction: IN

