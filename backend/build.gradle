plugins {
    id 'org.gosu-lang.gosu' version '8.2.1' apply false
}

subprojects {
    apply plugin: 'org.gosu-lang.gosu'
    
    repositories {
        mavenCentral()
    }
    
    java {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }
    
    dependencies {
        implementation 'org.gosu-lang.gosu:gosu-core:1.18.1'
        implementation 'org.gosu-lang.gosu:gosu-core-api:1.18.1'
        
        testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }
    
    test {
        useJUnitPlatform()
        // Gosu generates inner proxy/block classes (Foo$ProxyFor_..., Foo$block_1_) next to test classes; they are not tests.
        exclude '**/*$*'
    }
    
    sourceSets {
        main {
            gosu {
                srcDir 'src/main/gosu'
            }
        }
        test {
            gosu {
                srcDir 'src/test/gosu'
            }
        }
    }
}

project(':contracts') {
    dependencies {
        implementation 'com.fasterxml.jackson.core:jackson-databind:2.15.3'
        implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.15.3'
    }
}

project(':core') {
    dependencies {
        implementation project(':contracts')
        implementation 'com.fasterxml.jackson.core:jackson-databind:2.15.3'
        implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.15.3'
        implementation 'org.yaml:snakeyaml:2.2'
        implementation 'org.jgrapht:jgrapht-core:1.5.2'
    }
}

project(':eval') {
    apply plugin: 'application'
    
    mainClassName = 'provenpath.eval.RunEval'
    
    dependencies {
        implementation project(':contracts')
        implementation project(':core')
        implementation 'com.fasterxml.jackson.core:jackson-databind:2.15.3'
        implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.15.3'
    }
}

project(':app') {
    apply plugin: 'application'

    application {
        mainClass = 'provenpath.app.Main'
    }

    dependencies {
        implementation project(':contracts')
        implementation project(':core')
        implementation 'com.fasterxml.jackson.core:jackson-databind:2.15.3'
        implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.15.3'
        implementation 'io.javalin:javalin:5.6.3'
        implementation 'org.slf4j:slf4j-simple:2.0.13'
        implementation 'org.postgresql:postgresql:42.7.3'
        implementation 'com.zaxxer:HikariCP:5.1.0'
        implementation 'org.flywaydb:flyway-core:9.22.3'
        // DB_MODE=embedded: a private PostgreSQL 16 started from the jar (Guidewire VM: no Docker, no admin, no install).
        implementation 'io.zonky.test:embedded-postgres:2.2.2'
        implementation enforcedPlatform('io.zonky.test.postgres:embedded-postgres-binaries-bom:16.15.0')
    }

    test {
        environment 'PROVENPATH_TEST', 'true'
        environment 'PROVENPATH_RULES_DIR', "${rootDir}/../rules"
        environment 'PROVENPATH_FIXTURES_DIR', "${rootDir}/../fixtures"
        environment 'PROVENPATH_EVAL_DIR', "${rootDir}/../eval"
        environment 'VERIFY_NODE_DELAY_MS', '0'
        environment 'AGENT_LONG_POLL_MS', '1500'
        environment 'PC_AGENT_KEY', 'test-agent-key'
        environment 'PROVENPATH_GATE_SECRET', System.getenv('PROVENPATH_GATE_SECRET') ?: 'test-secret'
        testLogging { events 'failed'; exceptionFormat 'full' }
    }

    // Single runnable jar (used by the Docker image and by vm\start-all.cmd on the Guidewire VM).
    tasks.register('fatJar', Jar) {
        archiveFileName = 'provenpath-app.jar'
        manifest { attributes 'Main-Class': 'provenpath.app.Main' }
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
        from sourceSets.main.output
        dependsOn configurations.runtimeClasspath
        from { configurations.runtimeClasspath.findAll { it.name.endsWith('jar') }.collect { zipTree(it) } }
        exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
    }
}

// Track C: AI Layer — depends ONLY on :contracts (never on :core or :app)
project(':planner') {
    dependencies {
        implementation project(':contracts')
        implementation 'com.fasterxml.jackson.core:jackson-databind:2.15.3'
        implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.15.3'
    }
}

// Wire :planner into :app at runtime (class-name loading, no compile dependency)
project(':app') {
    dependencies {
        runtimeOnly project(':planner')
    }
}

// Track B: PolicyCenter package builder. Depends ONLY on :contracts; loaded by class name (PACKAGE_BUILDER_CLASS).
project(':pcexport') {
    dependencies {
        implementation project(':contracts')
        implementation 'com.fasterxml.jackson.core:jackson-databind:2.15.3'
        implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.15.3'
    }
    test {
        systemProperty 'provenpath.test', 'true'
        environment 'PROVENPATH_PC_TEMPLATE_DIR', "${rootDir}/../policycenter/overlay-template"
        environment 'PROVENPATH_FIXTURES_DIR', "${rootDir}/../fixtures"
        testLogging { events 'failed'; exceptionFormat 'full' }
    }
}

project(':app') {
    dependencies {
        runtimeOnly project(':pcexport')
    }
    test {
        environment 'PROVENPATH_PC_TEMPLATE_DIR', "${rootDir}/../policycenter/overlay-template"
    }
}

// Track B: the PC agent that runs next to PolicyCenter on the VM (java -jar provenpath-pcagent.jar).
// Depends ONLY on :contracts (Signing re-checks the gate token and the manifest HMAC).
project(':pcagent') {
    apply plugin: 'application'

    application {
        mainClass = 'provenpath.pcagent.Main'
    }

    dependencies {
        implementation project(':contracts')
        implementation 'com.fasterxml.jackson.core:jackson-databind:2.15.3'
        implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.15.3'
        testImplementation project(':pcexport')
    }

    test {
        systemProperty 'provenpath.test', 'true'
        environment 'PROVENPATH_PC_TEMPLATE_DIR', "${rootDir}/../policycenter/overlay-template"
        environment 'PROVENPATH_FIXTURES_DIR', "${rootDir}/../fixtures"
        testLogging { events 'failed'; exceptionFormat 'full' }
    }

    tasks.register('fatJar', Jar) {
        archiveFileName = 'provenpath-pcagent.jar'
        manifest { attributes 'Main-Class': 'provenpath.pcagent.Main' }
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
        from sourceSets.main.output
        dependsOn configurations.runtimeClasspath
        from { configurations.runtimeClasspath.findAll { it.name.endsWith('jar') }.collect { zipTree(it) } }
        exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
    }
}
